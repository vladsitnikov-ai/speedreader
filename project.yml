name: SpeedReader
options:
  bundleIdPrefix: com.vladsitnikov
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: 37ZC9H35VN
    CODE_SIGN_STYLE: Automatic
    # The app uses no encryption of its own, so App Store Connect can skip the export-compliance question.
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
targets:
  SpeedReader-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: SpeedReader
        PRODUCT_BUNDLE_IDENTIFIER: com.vladsitnikov.speedreader.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Shared/macOS.entitlements
        SUPPORTS_MACCATALYST: NO
  SpeedReader-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Shared
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: SpeedReader
        PRODUCT_BUNDLE_IDENTIFIER: com.vladsitnikov.speedreader.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  SpeedReader-macOS:
    build:
      targets:
        SpeedReader-macOS: all
    run:
      config: Debug
  SpeedReader-iOS:
    build:
      targets:
        SpeedReader-iOS: all
    run:
      config: Debug
